name: Bug report
description: Report incorrect behavior or a regression.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real usage/cost exports, signed URLs, or unredacted screenshots.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic or redacted data.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 140, Firefox 142, Safari 19

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.x

  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I have removed usernames, IDs, signed URLs, usage exports, and cost records.
          required: true
