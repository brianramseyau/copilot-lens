name: Feature request
description: Suggest a report, metric, workflow, or visualization improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reporting need or workflow problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any metric methodology.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: This request contains no real exports, signed URLs, or attributable user data.
          required: true
